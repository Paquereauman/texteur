[package]
name = "texteur"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "0.31"
arboard = "3"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
quick-xml = "0.37"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows = { version = "0.62.2", features = ["Win32_Globalization", "Win32_System_Com", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winres = "0.1.12"
